  <rect width="512" height="512" rx="112" fill="#2F3343"/>
  <g transform="translate(256 262) scale(1.08) translate(-256 -256)">
  <!-- 回報板 -->
  <rect x="116" y="104" width="280" height="324" rx="30" fill="#FAF6EE"/>
  <!-- 金色夾子 -->
