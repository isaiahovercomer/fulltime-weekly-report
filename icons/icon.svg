    <rect x="278" y="176" width="24" height="24" rx="6"/>
    <rect x="312" y="176" width="24" height="24" rx="6"/>
  </g>
  <rect x="346" y="176" width="24" height="24" rx="6" fill="#B03A2E"/>
  <!-- 往上長的長條 -->
  <g fill="#C49356">
    <rect x="158" y="318" width="44" height="74" rx="8"/>
